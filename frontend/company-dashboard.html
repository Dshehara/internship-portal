<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Company Dashboard - InternHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary" id="mainNav"></nav>

<div class="container py-4">

    <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border text-primary"></div>
    </div>

    <div id="dashContent" class="d-none">
        <div class="row">

            <!-- Company Profile Card -->
            <div class="col-md-4">
                <div class="card shadow-sm mb-4 text-center p-4">
                    <div class="avatar-circle bg-success text-white mx-auto mb-3">
                        <span id="avatarLetter" class="fs-1 fw-bold"></span>
                    </div>
                    <h5 class="fw-bold" id="companyName"></h5>
                    <p class="text-muted small" id="companyEmail"></p>
                    <span class="badge bg-success">🏢 Company</span>
                    <hr>
                    <div id="companyDetails" class="text-start small">
                        <p><strong>Industry:</strong> <span id="companyIndustry">Not set</span></p>
                        <p><strong>Website:</strong> <span id="companyWebsite">Not set</span></p>
                    </div>
                    <button class="btn btn-outline-success w-100 mt-2" onclick="toggleEdit()">
                        ✏️ Edit Profile
                    </button>
                    <a href="post-listing.html" class="btn btn-primary w-100 mt-2">
                        + Post Internship
                    </a>
                </div>
            </div>

            <!-- Edit Profile + My Listings -->
            <div class="col-md-8">

                <!-- Edit Profile (hidden by default) -->
                <div id="editCard" class="card shadow-sm mb-4 d-none">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3">Edit Company Profile</h6>
                        <div id="editError" class="alert alert-danger d-none"></div>
                        <div id="editSuccess" class="alert alert-success d-none"></div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Company Name</label>
                            <input type="text" class="form-control" id="editName">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Industry</label>
                            <input type="text" class="form-control" id="editIndustry"
                                placeholder="e.g. Information Technology">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Website</label>
                            <input type="text" class="form-control" id="editWebsite"
                                placeholder="https://yourcompany.com">
                        </div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-success" onclick="updateProfile()">Save</button>
                            <button class="btn btn-outline-secondary" onclick="toggleEdit()">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- My Listings -->
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0">My Posted Internships</h5>
                            <a href="post-listing.html" class="btn btn-primary btn-sm">+ Add New</a>
                        </div>
                        <div id="myListingsContainer">
                            <div class="text-center py-3 text-muted">Loading your listings...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Listing Modal -->
<div class="modal fade" id="editListingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Internship</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editListingId">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Title</label>
                    <input type="text" class="form-control" id="editListingTitle">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea class="form-control" id="editListingDesc" rows="3"></textarea>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-semibold">Location</label>
                        <input type="text" class="form-control" id="editListingLocation">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-semibold">Duration</label>
                        <input type="text" class="form-control" id="editListingDuration">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Deadline</label>
                    <input type="date" class="form-control" id="editListingDeadline">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveListingEdit()">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<!-- Applicants Modal -->
<div class="modal fade" id="applicantsModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">👥 Applicants</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="applicantsBody">
                Loading...
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/company.js"></script>
</body>
</html>
