<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard - InternHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark" id="mainNav"></nav>

<div id="loadingSpinner" class="text-center py-5 mt-4">
    <div class="spinner-border"></div>
    <p class="mt-3 text-muted">Loading your profile...</p>
</div>

<div id="profileContent" class="d-none">

    <div class="page-header">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <div class="avatar-circle" style="width:56px;height:56px;font-size:1.4rem">
                    <span id="avatarLetter"></span>
                </div>
                <div>
                    <h4 id="profileName" class="mb-0"></h4>
                    <p id="profileEmail" class="mb-0"></p>
                </div>
            </div>
        </div>
    </div>

    <div class="container pb-5">
        <div class="row g-4">

            <!-- Left sidebar -->
            <div class="col-md-4">
                <div class="card mb-3">
                    <div class="card-body p-4">
                        <h6 class="fw-bold mb-3" style="color:var(--gray);text-transform:uppercase;font-size:0.75rem;letter-spacing:1px">Quick Links</h6>
                        <a href="listings.html" class="btn btn-primary w-100 mb-2">🔍 Browse Internships</a>
                        <a href="my-applications.html" class="btn btn-outline-primary w-100">📋 My Applications</a>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-4 text-center">
                        <span class="badge bg-primary px-3 py-2">🎓 Student</span>
                        <p class="text-muted small mt-3 mb-0">Complete your profile so companies can see your skills when you apply.</p>
                    </div>
                </div>
            </div>

            <!-- Profile Card -->
            <div class="col-md-8">
                <div class="card">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold mb-0">My Profile</h5>
                            <button class="btn btn-outline-primary btn-sm" onclick="toggleEdit()">✏️ Edit Profile</button>
                        </div>

                        <!-- View Mode -->
                        <div id="viewMode">
                            <div class="info-row">
                                <span class="info-label">Phone</span>
                                <span class="info-value" id="viewPhone">Not set</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Skills</span>
                                <span class="info-value" id="viewSkills">Not set</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">CV Link</span>
                                <span class="info-value">
                                    <a id="viewCvLink" href="#" target="_blank">Not set</a>
                                </span>
                            </div>
                        </div>

                        <!-- Edit Mode -->
                        <div id="editMode" class="d-none">
                            <div id="updateError" class="alert alert-danger d-none"></div>
                            <div id="updateSuccess" class="alert alert-success d-none"></div>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="editName">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Phone</label>
                                    <input type="text" class="form-control" id="editPhone" placeholder="07X XXX XXXX">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Skills</label>
                                    <input type="text" class="form-control" id="editSkills"
                                        placeholder="e.g. Java, Spring Boot, MySQL, JavaScript">
                                    <div class="form-text">Separate skills with commas</div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">CV Link</label>
                                    <input type="text" class="form-control" id="editCvLink"
                                        placeholder="https://drive.google.com/...">
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-4">
                                <button class="btn btn-primary px-4" onclick="updateProfile()">Save Changes</button>
                                <button class="btn btn-outline-secondary" onclick="toggleEdit()">Cancel</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
