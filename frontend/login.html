<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InternHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark" id="mainNav"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="text-center mb-4">
                <div class="avatar-circle mx-auto mb-3" style="width:60px;height:60px;font-size:1.5rem;background:linear-gradient(135deg,var(--cyan),#0891B2)">👋</div>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted small">Login to your InternHub account</p>
            </div>

            <div class="card p-4">
                <div class="d-flex gap-2 mb-4">
                    <button class="btn btn-primary flex-fill" id="studentBtn" onclick="selectRole('student')">
                        🎓 Student
                    </button>
                    <button class="btn btn-outline-primary flex-fill" id="companyBtn" onclick="selectRole('company')">
                        🏢 Company
                    </button>
                </div>

                <div id="errorMsg" class="alert alert-danger d-none"></div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password">
                </div>

                <button class="btn btn-primary w-100 btn-lg" onclick="login()">Login</button>
                <p class="text-center mt-3 mb-0 text-muted small">
                    No account? <a href="register.html" class="fw-600">Register here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
