<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - InternHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark" id="mainNav"></nav>

<div class="page-header">
    <div class="container">
        <h4>📋 My Applications</h4>
        <p>Track all your internship applications</p>
    </div>
</div>

<div class="container pb-5">

    <div id="loadingSpinner" class="text-center py-5">
        <div class="spinner-border"></div>
        <p class="mt-3 text-muted">Loading your applications...</p>
    </div>

    <div id="noApps" class="empty-state d-none">
        <div class="empty-icon">📭</div>
        <h5>No applications yet</h5>
        <p>Browse internships and hit Apply Now to get started</p>
        <a href="listings.html" class="btn btn-primary mt-2">🔍 Browse Internships</a>
    </div>

    <div class="row g-3 fade-in-up" id="appsContainer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/applications.js"></script>
</body>
</html>
